<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#78909c; stroke-width:1.2; rx:8; }
      .grp { fill:#f4f7f9; stroke:#b0bec5; stroke-width:1; rx:10; }
      .t { font-size:13px; fill:#1c2430; font-weight:bold; }
      .s { font-size:11px; fill:#546e7a; }
      .p { font-size:10.5px; fill:#00695c; font-family:Consolas,monospace; }
      .ln { stroke:#455a64; stroke-width:1.3; fill:none; marker-end:url(#ar); }
      .ln2 { stroke:#ef6c00; stroke-width:1.3; fill:none; stroke-dasharray:5 3; marker-end:url(#ar); }
      .h { font-size:15px; fill:#004d40; font-weight:bold; }
    </style>
  </defs>

  <text x="24" y="34" class="h">RuanRuan Desktop Pet · System Architecture Topology (English)</text>
  <text x="24" y="54" class="s">Electron desktop AI companion + DeepSeek Harness workbench + Babylon.js rendering + motion-core cerebellum · v2026-10 (formerly RuanYun Desktop Pet)</text>

  <!-- User layer -->
  <rect x="20" y="80" width="180" height="150" class="grp"/>
  <text x="34" y="102" class="t">User / Desktop</text>
  <rect x="34" y="114" width="152" height="30" class="box"/><text x="44" y="134" class="s">Text input · Voice call</text>
  <rect x="34" y="152" width="152" height="30" class="box"/><text x="44" y="172" class="s">Desktop icon layer (WorkerW)</text>
  <rect x="34" y="190" width="152" height="30" class="box"/><text x="44" y="210" class="s">System idle via powerMonitor</text>

  <!-- Window layer -->
  <rect x="230" y="80" width="250" height="290" class="grp"/>
  <text x="244" y="102" class="t">Electron Window Layer</text>
  <rect x="244" y="114" width="222" height="56" class="box"/>
  <text x="254" y="132" class="s">Main window: home preview / console / settings</text>
  <text x="254" y="150" class="s">/chat = DeepSeek Harness iframe</text>
  <text x="254" y="164" class="p">loads static UI from :5175</text>
  <rect x="244" y="178" width="222" height="40" class="box"/>
  <text x="254" y="196" class="s">Pet window (bottom-right, own Babylon engine)</text>
  <text x="254" y="212" class="s">Wallpaper window (fullscreen transparent, WorkerW)</text>
  <rect x="244" y="226" width="222" height="40" class="box"/>
  <text x="254" y="244" class="s">Wallpaper console (floating ball, console.html)</text>
  <text x="254" y="260" class="s">exit / call / settings / 3D scene entries</text>
  <rect x="244" y="274" width="222" height="40" class="box"/>
  <text x="254" y="292" class="s">Speech recognition bridge (separate Edge page)</text>
  <text x="254" y="308" class="p">anti-throttling flags + Web Worker heartbeat</text>
  <rect x="244" y="322" width="222" height="36" class="box"/>
  <text x="254" y="340" class="s">preload bridges (contextBridge)</text>
  <text x="254" y="354" class="p">desktopPet / wallpaperMode / scene3d / ...</text>

  <!-- Render layer -->
  <rect x="510" y="80" width="270" height="290" class="grp"/>
  <text x="524" y="102" class="t">Render Engine (active = Babylon.js)</text>
  <rect x="524" y="114" width="242" height="120" class="box"/>
  <text x="534" y="132" class="s">BabylonModelViewer (single preview render source)</text>
  <text x="534" y="150" class="s">· AnimSystem: breath / blink / gaze / micro-motion</text>
  <text x="534" y="166" class="s">· action queue + concurrent lane · std recipes · VMD</text>
  <text x="534" y="182" class="s">· vmdClipPlayer (rotation + center displacement)</text>
  <text x="534" y="198" class="s">· 3D scene editor __scene3d (multi-model / drag / XYZ)</text>
  <text x="534" y="214" class="s">· joint pipeline: safeRotateJoint limits + collision</text>
  <text x="534" y="230" class="p">PMX/PMD (babylon-mmd) · GLB/GLTF/OBJ (loaders)</text>
  <rect x="524" y="242" width="242" height="34" class="box"/>
  <text x="534" y="260" class="s">FrameBroadcaster 30fps (built · not wired)</text>
  <text x="534" y="272" class="p">design: frame stream replaces multi-engine</text>
  <rect x="524" y="284" width="242" height="40" class="box"/>
  <text x="534" y="302" class="s">Godot 4.7.2 optional 2nd renderer (better quality)</text>
  <text x="534" y="318" class="p">standalone process · SetParent embed · TCP 9880</text>
  <rect x="524" y="332" width="242" height="30" class="box"/>
  <text x="534" y="352" class="p">JointControlService: serial exec → POST /result</text>

  <!-- Main process -->
  <rect x="810" y="80" width="250" height="290" class="grp"/>
  <text x="824" y="102" class="t">Main process electron-main.js</text>
  <rect x="824" y="114" width="222" height="30" class="box"/><text x="834" y="134" class="p">UI static server :5175 (no-cache)</text>
  <rect x="824" y="150" width="222" height="30" class="box"/><text x="834" y="170" class="p">command poll 1s → IPC broadcast 3 windows</text>
  <rect x="824" y="186" width="222" height="30" class="box"/><text x="834" y="206" class="p">companion heartbeat 30s → /companion/idle-tick</text>
  <rect x="824" y="222" width="222" height="30" class="box"/><text x="834" y="242" class="p">scene3d IPC: layout JSON + asset store</text>
  <rect x="824" y="258" width="222" height="30" class="box"/><text x="834" y="278" class="p">DSH bridge dshHarness.js (start/reuse/token)</text>
  <rect x="824" y="294" width="222" height="30" class="box"/><text x="834" y="314" class="p">process mgmt: backend/hub/TTS/Edge/gui-agent</text>
  <rect x="824" y="330" width="222" height="30" class="box"/><text x="834" y="350" class="p">tray / lifecycle v179 · wallpaper WorkerW</text>

  <!-- Backend -->
  <rect x="230" y="400" width="510" height="180" class="grp"/>
  <text x="244" y="422" class="t">Backend Express :27865 (brain API layer)</text>
  <rect x="244" y="434" width="238" height="86" class="box"/>
  <text x="254" y="452" class="s">runBrain: DSH CLI→cloud→fallback</text>
  <text x="254" y="470" class="s">[MOTION] extract → enqueue (whitelist+cd)</text>
  <text x="254" y="488" class="s">providers.json authority (placeholder never wins)</text>
  <text x="254" y="506" class="p">activity timestamps (in-memory, reset on restart)</text>
  <rect x="492" y="434" width="234" height="86" class="box"/>
  <text x="502" y="452" class="s">/companion: idle scheduler v1.1 (single rhythm owner)</text>
  <text x="502" y="470" class="s">idle judge / shuffle bag / AI-gen / quota / night quiet</text>
  <text x="502" y="488" class="s">/dance-hint /dance-did (rotation hints)</text>
  <text x="502" y="506" class="p">driven by 30s heartbeat · /state debug</text>
  <rect x="244" y="528" width="238" height="40" class="box"/>
  <text x="254" y="546" class="s">/joint-control: command queue (TTL 30s)</text>
  <text x="254" y="562" class="p">/pending /result /pet-action (legal vmdClip entry)</text>
  <rect x="492" y="528" width="234" height="40" class="box"/>
  <text x="502" y="546" class="s">/motion /device /optimization /network /system</text>
  <text x="502" y="562" class="p">/update /model /screen /security /agent</text>

  <!-- Cerebellum -->
  <rect x="230" y="610" width="510" height="120" class="grp"/>
  <text x="244" y="632" class="t">Cerebellum motion-core (protocol layer)</text>
  <rect x="244" y="644" width="238" height="70" class="box"/>
  <text x="254" y="662" class="s">motion-hub.js :9877</text>
  <text x="254" y="680" class="s">primitives · validation · softGate · recipes</text>
  <text x="254" y="698" class="p">solve → postPetAction → 27865 queue</text>
  <rect x="492" y="644" width="234" height="70" class="box"/>
  <text x="502" y="662" class="s">vmd-pipeline (VMD → motion.json assets)</text>
  <text x="502" y="680" class="s">tuning viewer :9988 (bone sampling checks)</text>
  <text x="502" y="698" class="p">KINEMATICS.md = single source for axes/limits</text>

  <!-- Brain DSH -->
  <rect x="770" y="400" width="440" height="330" class="grp"/>
  <text x="784" y="422" class="t">Brain · DeepSeek Harness (DSH)</text>
  <rect x="784" y="434" width="412" height="56" class="box"/>
  <text x="794" y="452" class="s">DSH Web workbench :5190 (embedded in /chat iframe)</text>
  <text x="794" y="470" class="s">sessions / workspace / automation · rl-mic bridge</text>
  <text x="794" y="486" class="p">dsh-web frontend + dsh runtime (0.1.5-rc.2)</text>
  <rect x="784" y="498" width="412" height="56" class="box"/>
  <text x="794" y="516" class="s">dsh-bridge/dshHarness.js: main-process preferred bridge</text>
  <text x="794" y="534" class="s">start() / reuse checks / token pipe / providers sync / watchdog</text>
  <text x="794" y="550" class="p">DSH © DeepSeek · local adaptation patches (see THIRD_PARTY)</text>
  <rect x="784" y="562" width="412" height="56" class="box"/>
  <text x="794" y="580" class="s">dsh-workspace: providers.json = single API authority</text>
  <text x="794" y="598" class="s">.dsh/settings.yaml + three profiles + .credentials.yaml</text>
  <text x="794" y="614" class="p">model-map.json cold-start source</text>
  <rect x="784" y="626" width="412" height="56" class="box"/>
  <text x="794" y="644" class="s">pet-mcp (tools: pet / gui_task / gui_apps) + playwright-mcp</text>
  <text x="794" y="662" class="s">DSH automation → 27865 pet-action / 9877 hub</text>
  <text x="794" y="678" class="p">cordis.patch.yml points to app-side dsh-mcp</text>
  <rect x="784" y="690" width="412" height="30" class="box"/>
  <text x="794" y="710" class="p">sessionController self-heal watchdog (2 in 90s, 10min cooldown)</text>

  <!-- External -->
  <rect x="770" y="740" width="440" height="120" class="grp"/>
  <text x="784" y="762" class="t">External services</text>
  <rect x="784" y="774" width="200" height="36" class="box"/>
  <text x="794" y="792" class="s">Cloud LLM APIs (DeepSeek / GLM)</text>
  <text x="794" y="806" class="p">active provider from providers.json</text>
  <rect x="1000" y="774" width="196" height="36" class="box"/>
  <text x="1010" y="792" class="s">Local Qwen :11434 (external, optional)</text>
  <text x="1010" y="806" class="p">Desktop qwen2.5-3b, manual start</text>
  <rect x="784" y="818" width="412" height="30" class="box"/>
  <text x="794" y="838" class="p">gui-agent :5181 · browser-search :5180 · TTS · speech-bridge :5175</text>

  <!-- Lines -->
  <line x1="200" y1="129" x2="243" y2="129" class="ln"/>
  <line x1="200" y1="167" x2="230" y2="190" class="ln"/>
  <line x1="455" y1="142" x2="523" y2="142" class="ln"/>
  <line x1="455" y1="198" x2="523" y2="198" class="ln"/>
  <line x1="455" y1="246" x2="523" y2="246" class="ln"/>
  <line x1="455" y1="292" x2="523" y2="292" class="ln"/>
  <line x1="455" y1="340" x2="809" y2="200" class="ln"/>
  <line x1="780" y1="165" x2="809" y2="165" class="ln"/>
  <line x1="780" y1="340" x2="823" y2="340" class="ln"/>
  <line x1="645" y1="370" x2="645" y2="399" class="ln"/>
  <text x="655" y="386" class="s">text/voice → askHub</text>
  <line x1="766" y1="129" x2="809" y2="129" class="ln"/>
  <line x1="645" y1="580" x2="645" y2="609" class="ln"/>
  <text x="655" y="596" class="s">hub validate → queue</text>
  <line x1="934" y1="370" x2="934" y2="399" class="ln"/>
  <text x="944" y="386" class="s">runBrain</text>
  <line x1="934" y1="730" x2="934" y2="739" class="ln"/>
  <line x1="984" y1="792" x2="1030" y2="720" class="ln2"/>
  <line x1="1060" y1="490" x2="1060" y2="773" class="ln2"/>
  <text x="1068" y="640" class="s">DSH CLI / cloud</text>
  <line x1="452" y1="680" x2="492" y2="680" class="ln"/>
  <line x1="200" y1="205" x2="809" y2="201" class="ln2"/>
  <text x="204" y="76" class="s">idle-sec</text>
  <line x1="466" y1="480" x2="824" y2="201" class="ln2"/>
  <text x="500" y="392" class="s">30s heartbeat</text>
  <line x1="934" y1="201" x2="934" y2="399" class="ln2"/>
  <text x="840" y="378" class="s">POST :27865</text>
  <line x1="363" y1="568" x2="363" y2="609" class="ln"/>
  <text x="373" y="592" class="s">pet-action / vmdClip</text>

  <!-- Legend -->
  <rect x="20" y="610" width="180" height="120" class="grp"/>
  <text x="34" y="632" class="t">Legend</text>
  <line x1="34" y1="650" x2="84" y2="650" class="ln"/><text x="92" y="654" class="s">sync call / data</text>
  <line x1="34" y1="672" x2="84" y2="672" class="ln2"/><text x="92" y="676" class="s">heartbeat / external</text>
  <text x="34" y="700" class="s">Ports: 5175 UI · 27865 backend</text>
  <text x="34" y="716" class="s">9877 hub · 5190 DSH · 9880 Godot</text>
</svg>
