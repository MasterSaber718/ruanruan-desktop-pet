<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#78909c; stroke-width:1.2; rx:8; }
      .grp { fill:#f4f7f9; stroke:#b0bec5; stroke-width:1; rx:10; }
      .t { font-size:13px; fill:#1c2430; font-weight:bold; }
      .s { font-size:11px; fill:#546e7a; }
      .p { font-size:10.5px; fill:#00695c; font-family:Consolas,monospace; }
      .ln { stroke:#455a64; stroke-width:1.3; fill:none; marker-end:url(#ar); }
      .ln2 { stroke:#ef6c00; stroke-width:1.3; fill:none; stroke-dasharray:5 3; marker-end:url(#ar); }
      .h { font-size:15px; fill:#004d40; font-weight:bold; }
    </style>
  </defs>

  <text x="24" y="34" class="h">阮阮桌面宠物 · 系统架构拓扑图（中文版 / Chinese）</text>
  <text x="24" y="54" class="s">Electron 桌面 AI 伴侣 + DeepSeek Harness 工作台 + Babylon.js 渲染 + motion-core 小脑 · v2026-10（曾用名：阮云小宠）</text>

  <!-- 用户层 -->
  <rect x="20" y="80" width="180" height="150" class="grp"/>
  <text x="34" y="102" class="t">用户 / 桌面</text>
  <rect x="34" y="114" width="152" height="30" class="box"/><text x="44" y="134" class="s">文字输入 · 语音通话</text>
  <rect x="34" y="152" width="152" height="30" class="box"/><text x="44" y="172" class="s">桌面图标层（WorkerW）</text>
  <rect x="34" y="190" width="152" height="30" class="box"/><text x="44" y="210" class="s">系统闲置状态 powerMonitor</text>

  <!-- 窗口层 -->
  <rect x="230" y="80" width="250" height="290" class="grp"/>
  <text x="244" y="102" class="t">Electron 窗口层</text>
  <rect x="244" y="114" width="222" height="56" class="box"/>
  <text x="254" y="132" class="s">主窗口：主页预览 / 控制台 / 设置</text>
  <text x="254" y="150" class="s">/chat = DeepSeek Harness iframe</text>
  <text x="254" y="164" class="p">加载 5175 静态 UI</text>
  <rect x="244" y="178" width="222" height="40" class="box"/>
  <text x="254" y="196" class="s">桌宠窗口（右下角，独立 Babylon 引擎）</text>
  <text x="254" y="212" class="s">壁纸窗口（全屏透明，挂 WorkerW）</text>
  <rect x="244" y="226" width="222" height="40" class="box"/>
  <text x="254" y="244" class="s">壁纸控制台（悬浮球 console.html）</text>
  <text x="254" y="260" class="s">退出/通话/设置/3D场景 入口</text>
  <rect x="244" y="274" width="222" height="40" class="box"/>
  <text x="254" y="292" class="s">语音识别桥（Edge 独立页 · 防节流）</text>
  <text x="254" y="308" class="p">防节流 flags + Web Worker 心跳</text>
  <rect x="244" y="322" width="222" height="36" class="box"/>
  <text x="254" y="340" class="s">preload 桥（contextBridge）</text>
  <text x="254" y="354" class="p">desktopPet/wallpaperMode/scene3d/…</text>

  <!-- 渲染引擎层 -->
  <rect x="510" y="80" width="270" height="290" class="grp"/>
  <text x="524" y="102" class="t">渲染引擎（现役 = Babylon.js）</text>
  <rect x="524" y="114" width="242" height="120" class="box"/>
  <text x="534" y="132" class="s">BabylonModelViewer（主预览唯一渲染源）</text>
  <text x="534" y="150" class="s">· AnimSystem：呼吸/眨眼/视线/微动作</text>
  <text x="534" y="166" class="s">· 动作队列+并发通道 · std 配方 · VMD 播放</text>
  <text x="534" y="182" class="s">· vmdClipPlayer（旋转+center 位移通道）</text>
  <text x="534" y="198" class="s">· 3D场景编辑层 __scene3d（多模型/拖拽/XYZ）</text>
  <text x="534" y="214" class="s">· 关节管线：safeRotateJoint 生理极限+碰撞回滚</text>
  <text x="534" y="230" class="p">PMX/PMD(babylon-mmd) · GLB/GLTF/OBJ(loaders)</text>
  <rect x="524" y="242" width="242" height="34" class="box"/>
  <text x="534" y="260" class="s">FrameBroadcaster 30fps 帧流（已建成·未接线）</text>
  <text x="534" y="272" class="p">设计：帧流替代多引擎</text>
  <rect x="524" y="284" width="242" height="40" class="box"/>
  <text x="534" y="302" class="s">Godot 4.7.2 可选第二渲染端（画质更优）</text>
  <text x="534" y="318" class="p">独立进程 · SetParent 嵌入预览区 · TCP 9880</text>
  <rect x="524" y="332" width="242" height="30" class="box"/>
  <text x="534" y="352" class="p">JointControlService：串行执行 → 回传 /result</text>

  <!-- 主进程 -->
  <rect x="810" y="80" width="250" height="290" class="grp"/>
  <text x="824" y="102" class="t">主进程 electron-main.js</text>
  <rect x="824" y="114" width="222" height="30" class="box"/><text x="834" y="134" class="p">UI 静态服务 :5175（no-cache）</text>
  <rect x="824" y="150" width="222" height="30" class="box"/><text x="834" y="170" class="p">指令轮询 1s → IPC 广播三窗口+Godot</text>
  <rect x="824" y="186" width="222" height="30" class="box"/><text x="834" y="206" class="p">陪伴心跳 30s → /companion/idle-tick</text>
  <rect x="824" y="222" width="222" height="30" class="box"/><text x="834" y="242" class="p">scene3d IPC：布局 JSON + 资产落盘</text>
  <rect x="824" y="258" width="222" height="30" class="box"/><text x="834" y="278" class="p">DSH 桥 dshHarness.js（start/复用/token）</text>
  <rect x="824" y="294" width="222" height="30" class="box"/><text x="834" y="314" class="p">进程管理：backend/hub/TTS/Edge/gui-agent</text>
  <rect x="824" y="330" width="222" height="30" class="box"/><text x="834" y="350" class="p">托盘/生命周期 v179 语义 · 壁纸 WorkerW</text>

  <!-- 后端 -->
  <rect x="230" y="400" width="510" height="180" class="grp"/>
  <text x="244" y="422" class="t">后端 Express :27865（大脑接口层）</text>
  <rect x="244" y="434" width="238" height="86" class="box"/>
  <text x="254" y="452" class="s">runBrain：DSH CLI→云端→本地兜底</text>
  <text x="254" y="470" class="s">[MOTION] 抽取 → 入队（白名单+冷却）</text>
  <text x="254" y="488" class="s">providers.json 权威（占位 key 不覆盖）</text>
  <text x="254" y="506" class="p">activity 时间戳（内存，重启归零）</text>
  <rect x="492" y="434" width="234" height="86" class="box"/>
  <text x="502" y="452" class="s">/companion：闲置陪伴调度 v1.1（唯一节奏管理者）</text>
  <text x="502" y="470" class="s">闲置判定/动作袋/AI 生成/配额/夜间静音/通话顺延</text>
  <text x="502" y="488" class="s">/dance-hint /dance-did（跳舞轮换提示）</text>
  <text x="502" y="506" class="p">30s 心跳驱动 · state 排障</text>
  <rect x="244" y="528" width="238" height="40" class="box"/>
  <text x="254" y="546" class="s">/joint-control：指令队列（TTL 30s）</text>
  <text x="254" y="562" class="p">/pending /result /pet-action（vmdClip 合法入口）</text>
  <rect x="492" y="528" width="234" height="40" class="box"/>
  <text x="502" y="546" class="s">/motion /device /optimization /network /system</text>
  <text x="502" y="562" class="p">/update /model /screen /security /agent</text>

  <!-- 小脑 -->
  <rect x="230" y="610" width="510" height="120" class="grp"/>
  <text x="244" y="632" class="t">小脑 motion-core（协议层）</text>
  <rect x="244" y="644" width="238" height="70" class="box"/>
  <text x="254" y="662" class="s">motion-hub.js :9877</text>
  <text x="254" y="680" class="s">原语库 · 参数校验 · softGate · 配方</text>
  <text x="254" y="698" class="p">solve → postPetAction → 27865 队列</text>
  <rect x="492" y="644" width="234" height="70" class="box"/>
  <text x="502" y="662" class="s">vmd-pipeline（VMD→motion.json 资产）</text>
  <text x="502" y="680" class="s">viewer 调参页 :9988（骨骼采样验证）</text>
  <text x="502" y="698" class="p">KINEMATICS.md = 轴向/极限唯一基准</text>

  <!-- 大脑 DSH -->
  <rect x="770" y="400" width="440" height="330" class="grp"/>
  <text x="784" y="422" class="t">大脑 · DeepSeek Harness（DSH）</text>
  <rect x="784" y="434" width="412" height="56" class="box"/>
  <text x="794" y="452" class="s">DSH Web 工作台 :5190（/chat iframe 内嵌）</text>
  <text x="794" y="470" class="s">会话/工作区/自动化 · rl-mic 麦克风桥</text>
  <text x="794" y="486" class="p">dsh-web 前端 + dsh runtime（0.1.5-rc.2）</text>
  <rect x="784" y="498" width="412" height="56" class="box"/>
  <text x="794" y="516" class="s">dsh-bridge/dshHarness.js：主进程优先 require 的桥</text>
  <text x="794" y="534" class="s">start()/复用判据/token 管道/providers 同步/自愈看门狗</text>
  <text x="794" y="550" class="p">DSH © DeepSeek · 本项目含本地适配补丁（见 THIRD_PARTY）</text>
  <rect x="784" y="562" width="412" height="56" class="box"/>
  <text x="794" y="580" class="s">dsh-workspace：providers.json = API 唯一权威</text>
  <text x="794" y="598" class="s">.dsh/settings.yaml + 三 profile + .credentials.yaml</text>
  <text x="794" y="614" class="p">model-map.json 冷启动源</text>
  <rect x="784" y="626" width="412" height="56" class="box"/>
  <text x="794" y="644" class="s">pet-mcp（工具：pet/gui_task/gui_apps）+ playwright-mcp</text>
  <text x="794" y="662" class="s">DSH 自动化 → 27865 pet-action / 9877 hub</text>
  <text x="794" y="678" class="p">cordis.patch.yml 指向 app 侧 dsh-mcp</text>
  <rect x="784" y="690" width="412" height="30" class="box"/>
  <text x="794" y="710" class="p">sessionController 自愈看门狗（90s/2 次阈值，10min 冷却）</text>

  <!-- 外部 -->
  <rect x="770" y="740" width="440" height="120" class="grp"/>
