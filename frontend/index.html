<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- [修复 BLOCKER-3 Edge-to-Edge]
         viewport-fit=cover 是 env(safe-area-inset-*) 生效的前提条件。缺少它时，
         安卓 15/16 强制全屏铺展后 CSS 读到的 safe-area 恒为 0px，内容会被状态栏/
         导航条/挖孔遮挡。
         maximum-scale=1 + user-scalable=no 防止输入框聚焦时 WebView 自动缩放导致布局跳动。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 跟随系统深浅色，避免 WebView 强制反色造成的显示异常 -->
    <meta name="color-scheme" content="light dark" />
    <title>阮云小宠</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
